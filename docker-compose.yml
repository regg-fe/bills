name: bills-dev

services:
  # 1. Base de datos principal
  postgres:
    image: postgres:16-alpine
    container_name: bills-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bills_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bills_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Connection Pooler para Postgres (Transaction Mode)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: bills-pgbouncer
    restart: unless-stopped
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-bills_db}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Caché y colas (BullMQ)
  redis:
    image: redis:7-alpine
    container_name: bills-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Almacenamiento S3 Local
  minio:
    image: minio/minio:latest
    container_name: bills-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 5. Capturador de correos de prueba
  mailpit:
    image: axllent/mailpit:latest
    container_name: bills-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # Puerto SMTP
      - "${MAILPIT_UI_PORT:-8025}:8025"   # Interfaz Web
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data

  # 7. Migraciones (dbmate): se usa bajo demanda, nunca "up" automático.
  #    Importante: apunta a postgres DIRECTO (:5432), no a PgBouncer (:6432) —
  #    las TX de DDL no pasan por el pooler tx-mode.
  dbmate:
    image: ghcr.io/amacneil/dbmate:2.34.1   # pin: reproducibilidad (obs CodeRabbit #1)
    container_name: bills-dbmate
    profiles: ["tools"]           # no arranca con `docker compose up` normal
    volumes:
      - ./sql:/db                 # las migraciones viven en sql/migrations
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-bills_db}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # 6. OCR Sidecar (Servicio pesado en Python/FastAPI - Descomentar al implementar Fase 2)
  # ocr-sidecar:
  #   build:
  #     context: ./services/ocr-sidecar
  #     dockerfile: Dockerfile
  #   container_name: bills-ocr-sidecar
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   profiles:
  #     - ocr

volumes:
  pgdata:
  redis_data:
  minio_data:
  mailpit_data: